<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Tablas</title>
</head>
<body>
    <hr>
    <div id="tablas">
        <h3>Sección de tablas</h3>
        <h2>Comparativa de formatos de imagen</h2>
        <table border="1">
            <caption>Características técnicas de formatos web</caption>
            <thead>
                <tr>
                    <th>Formato</th>
                    <th>Transparencia</th>
                    <th>Animación</th>
                    <th>Uso típico</th>
                </tr>
            </thead>
            <tfoot>
                <tr>
                    <td colspan="4">Fuente: MDN Web Docs</td>
                </tr>
            </tfoot>
            <tfoot>
                <tr>
                    <td>JPEG</td>
                    <td>No</td>
                    <td>No</td>
                    <td>Fotografías</td>
                </tr>
                <tr>
                    <td>PNG</td>
                    <td>Sí</td>
                    <td>No</td>
                    <td>Logos, iconos</td>
                </tr>
                <tr>
                    <td>GIF</td>
                    <td>Sí (binaria)</td>
                    <td>Sí</td>
                    <td>Animaciones cortas</td>
                </tr>
                <tr>
                    <td>SVG</td>
                    <td>Sí</td>
                    <td>Sí (Con CSS/JS)</td>
                    <td>Gráficos escalables</td>
                </tr>
            </tfoot>
        </table>
    </div>
</body>
