<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Selectores Adyacentes</title>
    <style>
        /* Selectores adyacentes */
        h1 + h2 {
            color: blue;
        }
        
        p + p {
            color: red;
        }
    </style>
</head>
<body>

    <h1>Título principal</h1>
    <h2>Subtitulo 01</h2>
    <p>Mi primer párrafo</p>
    <h2>Subtitulo 02</h2>
    <p>Lorem ipsum dolor sit amet ...p</p>
    <p>Lorem ipsum dolor sit amet ...p</p>

    <div>
        <p>Lorem ipsum dolor sit amet ...p</p>
    </div>

</body>
</html>
