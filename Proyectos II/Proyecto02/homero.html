<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Homero</title>
    <link rel='stylesheet' href='css/estilo.css'>
</head>
<body>
   <div class="dibujo">

    <!-- Cuerpo -->

    <div class="camisa"></div>
    <div class="manga"></div>

    <!-- Cabeza -->
    <div class="cabeza"></div>
    <div class="oreja"></div>

    <!-- Cabello -->
    <div class="pelo pelo1"></div>
    <div class="pelo pelo2"></div>

    <!-- Ojos -->
    <div class="ojo ojo1">
        <div class="pupila"></div>
    </div>

    <div class="ojo ojo2">
        <div class="pupila"></div>
    </div>

    <!-- Cara -->
    <div class="barba"></div>
    <div class="nariz"></div>
    <div class="boca"></div>

    <!-- Brazo, mano y dona forman una sola pieza animada -->
    <div class="brazo-completo">
        <div class="brazo"></div>
        <div class="mano-con-dona">
            <div class="dona">
                <div class="glaseado"></div>
                <div class="agujero"></div>
                <div class="chispa ch1"></div>
                <div class="chispa ch2"></div>
                <div class="chispa ch3"></div>
                <div class="chispa ch4"></div>
                <div class="chispa ch5"></div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
