<!DOCTYPE html>
<html lang="es">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Agenda V2</title>
        <link rel="stylesheet" href="css/agenda_v2.css">
</head>

<body>
        <main class="agenda">
                <section class="formulario">
                        <h2>Agregar Contacto</h2>
                        <form id="formulario" autocomplete="off">
                                <div class="campo"><label for="nombre">Nombre:</label><input id="nombre" type="text">
                                </div>
                                <div class="campo"><label for="telefono">Teléfono:</label><input id="telefono"
                                                type="tel"></div>
                                <div class="botones"><button type="button" id="guardar">Guardar</button><button
                                                type="button" id="buscar">Buscar</button><button type="button"
                                                id="eliminar">Eliminar</button><button type="button" id="todos">Eliminar
                                                Todos</button></div>
                        </form>
                        <p id="mensaje" role="status"></p>
                </section>
                <section class="contactos">
                        <h2>Lista de Contactos</h2>
                        <table>
                                <thead>
                                        <tr>
                                                <th>Nombre</th>
                                                <th>Celular</th>
                                        </tr>
                                </thead>
                                <tbody id="lista"></tbody>
                        </table>
                </section>
        </main>
        <script src="js/agenda_v2.js"></script>
</body>

</html>
